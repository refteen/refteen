<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNAKE | refteen DEV</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #080818; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: monospace; color: #fff; }
#header { position: absolute; top: 18px; left: 22px; font-size: 13px; color: #c770f0; letter-spacing: 2px; font-weight: bold; }
#score-bar { display: flex; gap: 32px; margin-bottom: 14px; font-size: 15px; color: #aaa; }
#score-bar span { color: #38bdf8; font-weight: bold; }
#game-wrap { position: relative; border: 2px solid #c770f033; border-radius: 8px; box-shadow: 0 0 40px #c770f022, 0 0 80px #38bdf811; overflow: hidden; }
canvas { display: block; background: #080818; }
.overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(8,8,24,0.88); gap: 16px; }
.overlay h2 { font-size: 28px; color: #c770f0; letter-spacing: 3px; }
.overlay p { font-size: 15px; color: #38bdf8; }
.hint { font-size: 12px; color: #555; letter-spacing: 1px; }
#final-score { font-size: 18px; color: #fff; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div id="header">SNAKE | refteen DEV</div>
<div id="score-bar">Score:&nbsp;<span id="score">0</span>&nbsp;&nbsp;&nbsp;Best:&nbsp;<span id="best">0</span></div>
<div id="game-wrap">
  <canvas id="c" width="500" height="400"></canvas>
  <div class="overlay" id="start-screen">
    <h2>SNAKE</h2>
    <p>Нажми Space чтобы начать</p>
    <div class="hint">WASD / Стрелки — управление</div>
  </div>
  <div class="overlay hidden" id="over-screen">
    <h2>GAME OVER</h2>
    <div id="final-score"></div>
    <p>Space / Enter — снова</p>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 25, H = 20, CELL = 20;
let snake, dir, nextDir, food, score, highScore, speed, loopId, running = false;

function init() {
  snake = [{x:12,y:10},{x:11,y:10},{x:10,y:10}];
  dir = {x:1,y:0}; nextDir = {x:1,y:0};
  score = 0; speed = 120;
  highScore = +localStorage.getItem('snakeHS') || 0;
  document.getElementById('score').textContent = 0;
  document.getElementById('best').textContent = highScore;
  placeFood(); draw();
}

function placeFood() {
  let pos;
  do { pos = {x: Math.floor(Math.random()*W), y: Math.floor(Math.random()*H)}; }
  while (snake.some(s => s.x===pos.x && s.y===pos.y));
  food = pos;
}

function step() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x<0||head.x>=W||head.y<0||head.y>=H||snake.some(s=>s.x===head.x&&s.y===head.y)) {
    gameOver(); return;
  }
  snake.unshift(head);
  if (head.x===food.x && head.y===food.y) {
    score++;
    document.getElementById('score').textContent = score;
    if (score > highScore) { highScore = score; localStorage.setItem('snakeHS', highScore); document.getElementById('best').textContent = highScore; }
    if (score % 5 === 0) speed = Math.max(60, speed - 10);
    placeFood();
  } else { snake.pop(); }
  draw();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // grid dots
  ctx.fillStyle = '#ffffff08';
  for (let x=0;x<W;x++) for (let y=0;y<H;y++) { ctx.beginPath(); ctx.arc(x*CELL+CELL/2, y*CELL+CELL/2, 1, 0, Math.PI*2); ctx.fill(); }
  // food glow
  const fx = food.x*CELL+CELL/2, fy = food.y*CELL+CELL/2;
  const gf = ctx.createRadialGradient(fx,fy,1,fx,fy,CELL*0.8);
  gf.addColorStop(0,'#ff6eb4'); gf.addColorStop(1,'transparent');
  ctx.fillStyle = gf; ctx.beginPath(); ctx.arc(fx,fy,CELL*0.8,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff6eb4'; ctx.beginPath(); ctx.arc(fx,fy,CELL*0.38,0,Math.PI*2); ctx.fill();
  // snake
  snake.forEach((seg, i) => {
    const t = i / Math.max(snake.length-1, 1);
    const r1=199,g1=112,b1=240, r2=56,g2=189,b2=248;
    const r=Math.round(r1+(r2-r1)*t), g=Math.round(g1+(g2-g1)*t), b=Math.round(b1+(b2-b1)*t);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    const pad = i===0 ? 1 : 2;
    ctx.beginPath();
    ctx.roundRect(seg.x*CELL+pad, seg.y*CELL+pad, CELL-pad*2, CELL-pad*2, 4);
    ctx.fill();
  });
}

function gameOver() {
  running = false; clearTimeout(loopId);
  document.getElementById('final-score').textContent = `Счёт: ${score}`;
  document.getElementById('over-screen').classList.remove('hidden');
}

function startGame() {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('over-screen').classList.add('hidden');
  running = true; init(); tick();
}

function tick() { if (!running) return; step(); loopId = setTimeout(tick, speed); }

document.addEventListener('keydown', e => {
  if (!running) {
    if (e.code==='Space'||e.code==='Enter') startGame();
    return;
  }
  const map = { ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
                 KeyW:{x:0,y:-1}, KeyS:{x:0,y:1}, KeyA:{x:-1,y:0}, KeyD:{x:1,y:0} };
  const nd = map[e.code];
  if (nd && !(nd.x===-dir.x && nd.y===-dir.y)) { nextDir = nd; e.preventDefault(); }
  if (e.code==='Space'||e.code==='Enter') { if(!running) startGame(); }
});

init();
</script>
</body>
</html>
